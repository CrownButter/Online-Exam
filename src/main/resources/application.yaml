spring:
  application:
    name: online-exam

  datasource:
    url: jdbc:mysql://localhost:3306/online_exam_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: examuser
    password: exampassword
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate   # WAJIB validate, bukan update/create — schema dikontrol Flyway, bukan Hibernate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug